<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>noditron</title>
  <!-- nodigraph's own stylesheet, unmodified, loaded from the vendored
       path — the editor chrome (canvas, toolbar, Inspector) needs to look
       exactly like nodigraph's own, since it *is* nodigraph's own. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@400&family=Merriweather:wght@400&display=swap"
  />
  <link rel="stylesheet" href="/nodigraph/styles.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Exactly the DOM nodigraph's own client/index.html has — every id
       here is one nodigraph's client/src/main.js looks up directly, so
       this has to match precisely for that unmodified script to find
       everything it expects. See server/src/app.js's own note on why this
       is loaded from /nodigraph/ instead of copied into this repo. -->
  <div id="app">
    <header id="topbar">
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="topbar-menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z" fill="currentColor" />
        </svg>
      </button>
      <span class="brand">noditron</span>
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <div id="header-actions"></div>
      <div id="online-users" class="online-users" hidden></div>
      <button id="inspector-toggle" class="menu-toggle" type="button" aria-label="Toggle inspector" aria-expanded="false" aria-controls="inspector">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <rect x="14.5" y="5" width="6.5" height="14" fill="currentColor" />
        </svg>
      </button>
      <div id="topbar-menu-backdrop" class="topbar-menu-backdrop" hidden></div>
      <div id="topbar-menu" class="topbar-menu">
        <div id="app-menu"></div>
        <div id="doc-sync"></div>
      </div>
    </header>
    <canvas id="scene-canvas"></canvas>
    <div id="inspector"></div>
    <button id="fab-parent" class="fab fab-left" type="button" aria-label="Go to parent">
      <svg data-icon="up" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M11 9v10h2V9h4.5L12 3.5 6.5 9z" fill="currentColor" />
      </svg>
      <svg data-icon="add-parent" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="display: none">
        <rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2.5" />
        <path d="M11 9.5h2v2.5h2.5v2H13V16.5h-2V14H8.5v-2H11z" fill="currentColor" />
      </svg>
    </button>
    <div id="fab-stack" class="fab-stack"></div>
    <div class="fab-stack fab-stack-right">
      <button id="fab-add-text" class="fab fab-mini" type="button" aria-label="Add text">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <text x="12" y="17" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" font-family="Georgia, serif">T</text>
        </svg>
      </button>
    </div>
    <button id="fab-add-block" class="fab" type="button" aria-label="Add block">
      <svg data-icon="add" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor" />
      </svg>
      <svg data-icon="enter" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="display: none">
        <path d="M4 11h10.5l-3.3-3.3 1.4-1.4L18.4 12l-5.8 5.7-1.4-1.4 3.3-3.3H4z" fill="currentColor" />
      </svg>
    </button>
  </div>

  <!-- noditron's own addition outside the canvas itself: the block
       palette (see src/palette.js). Every block's own status indicator is
       drawn directly into nodigraph's canvas paint instead (see
       src/canvasIndicators.js) — there's no separate DOM overlay layer to
       host anymore. -->
  <div id="noditron-palette"></div>

  <!-- Sets window.nodigraphExtraTabs — has to run *before* nodigraph's own
       main.js below, which reads it once while setting up the Inspector
       (see that file's own comment, and registerExtraTabs.js's). Module
       scripts execute in document order, so this being first is what
       guarantees that. -->
  <script type="module" src="src/registerExtraTabs.js"></script>
  <!-- nodigraph's own, unmodified main.js — sets up the whole editor and,
       at the very end, exposes window.nodigraph (see its own comment
       there) for exactly this kind of host page. -->
  <script type="module" src="/nodigraph/src/main.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
